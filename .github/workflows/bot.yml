name: MFO.ai Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests ntfy
      - run: python main.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY }}
      - name: Commit & Push reports.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports.json
          git commit -m "Chore: auto-update reports.json [skip ci]" || exit 0
          git push
