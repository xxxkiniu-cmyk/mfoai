name: MFO.ai Command Center Daily Run

on:
  workflow_dispatch:
  schedule:
    # Uruchomienie codziennie o 04:00 UTC (06:00 czasu polskiego)
    - cron: '0 4 * * *'

jobs:
  run-command-center:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests ntfy
      - run: python main.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_KEY }}
      - name: Commit & Push reports.json
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports.json
          if git diff --cached --quiet --exit-code -- reports.json; then
            echo "reports.json unchanged; skipping commit and push."
            exit 0
          else
            diff_status=$?
            if [ "$diff_status" -ne 1 ]; then
              exit "$diff_status"
            fi
          fi
          git commit -m "Chore: daily report update [skip ci]"
          git push
