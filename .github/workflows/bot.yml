name: MFO.ai Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python bot.py
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
